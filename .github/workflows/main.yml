name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download ONDK
        run: |
          url="https://github.com/topjohnwu/ondk/releases/download/r30.1/ondk-r30.1-linux.tar.xz"
          mkdir -p "${{ runner.temp }}/ondk"
          curl -fL "$url" -o "${{ runner.temp }}/ondk.tar.xz"
          tar -C "${{ runner.temp }}/ondk" --strip-components=1 -xf "${{ runner.temp }}/ondk.tar.xz"

      - name: Link ONDK Rust toolchain
        run: rustup toolchain link ondk "${{ runner.temp }}/ondk/toolchains/rust"

      - name: Build Ghostlock binary
        run: |
          export ANDROID_NDK_HOME="${{ runner.temp }}/ondk"
          export NDK_ROOT="$ANDROID_NDK_HOME"
          make -C src ghostlock

      - name: Build APK (unsigned)
        run: |
          export ONDK_HOME="${{ runner.temp }}/ondk"
          export ANDROID_NDK_HOME="$ONDK_HOME"
          export NDK_ROOT="$ONDK_HOME"
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GhostLock-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          archive: false
